name: Distributed Multi-Arch Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      redeploy_only:
        description: 'Skip build/test and just force-redeploy the current :latest images to ECS'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  sonarqube-scan:
    name: Build and analyze
    if: ${{ inputs.redeploy_only != 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  test-backend:
    if: ${{ inputs.redeploy_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/backend
      - name: Run tests
        run: npm test
        working-directory: apps/backend

  test-frontend:
    if: ${{ inputs.redeploy_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend
      - name: Run tests
        run: npm test
        working-directory: apps/frontend

  build-backend-arm:
    if: ${{ inputs.redeploy_only != 'true' }}
    needs: [test-backend]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-backend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-arm64

  build-backend-amd64:
    if: ${{ inputs.redeploy_only != 'true' }}
    needs: [test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-backend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-amd64

  merge-backend:
    if: ${{ inputs.redeploy_only != 'true' }}
    needs: [build-backend-arm, build-backend-amd64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-backend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.IMAGE_NAME }}:latest-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:latest

  build-frontend-arm:
    if: ${{ inputs.redeploy_only != 'true' }}
    needs: [test-frontend]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare docs for frontend image
        run: |
          mkdir -p apps/frontend/public/docs/diagrams
          cp -r docs/*.md apps/frontend/public/docs/ 2>/dev/null || true
          cp -r docs/diagrams/*.html apps/frontend/public/docs/diagrams/ 2>/dev/null || true
          cp -r docs/diagrams/*.json apps/frontend/public/docs/diagrams/ 2>/dev/null || true
          ls -R apps/frontend/public/docs | head -n 20
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-frontend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-arm64
          no-cache: true
          build-args: |
            VITE_AWS_REGION=us-east-2
            VITE_COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
            VITE_COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}

  build-frontend-amd64:
    if: ${{ inputs.redeploy_only != 'true' }}
    needs: [test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare docs for frontend image
        run: |
          mkdir -p apps/frontend/public/docs/diagrams
          cp -r docs/*.md apps/frontend/public/docs/ 2>/dev/null || true
          cp -r docs/diagrams/*.html apps/frontend/public/docs/diagrams/ 2>/dev/null || true
          cp -r docs/diagrams/*.json apps/frontend/public/docs/diagrams/ 2>/dev/null || true
          ls -R apps/frontend/public/docs | head -n 20
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-frontend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-amd64
          no-cache: true
          build-args: |
            VITE_AWS_REGION=us-east-2
            VITE_COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
            VITE_COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}

  merge-frontend:
    if: ${{ inputs.redeploy_only != 'true' }}
    needs: [build-frontend-arm, build-frontend-amd64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-frontend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.IMAGE_NAME }}:latest-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:latest

  deploy-infrastructure:
    if: ${{ !failure() }}
    needs: [merge-backend, merge-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: Terraform Init
        run: tofu init
        working-directory: infra

      - name: Terraform Plan
        run: tofu plan -input=false -out=tfplan
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_csrf_secret: ${{ secrets.CSRF_SECRET }}
          TF_VAR_cors_origin: ${{ secrets.CORS_ORIGIN }}

      - name: Terraform Apply
        run: tofu apply -input=false -auto-approve tfplan
        working-directory: infra

      - name: Deploy frontend to ECS
        run: |
          CLUSTER=$(tofu output -raw ecs_cluster_name)
          SERVICE=$(tofu output -raw frontend_service_name)
          # Force a redeploy of the terraform-managed task definition so ECS
          # re-pulls the newest :latest image (no manual register; keeps the
          # task config that terraform owns).
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment \
            > /dev/null

          echo "Frontend deployed to ECS"
        working-directory: infra

      - name: Deploy backend to ECS
        run: |
          CLUSTER=$(tofu output -raw ecs_cluster_name)
          SERVICE=$(tofu output -raw backend_service_name)
          # Redeploy the terraform-managed task definition so ECS re-pulls the
          # newest :latest backend image while keeping taskRoleArn, the
          # LAMBDA_FUNCTION_NAME env and every variable that terraform owns.
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment \
            > /dev/null

          echo "Backend deployed to ECS"
        working-directory: infra

      - name: Run Prisma migrations (AWS RDS)
        run: |
          CLUSTER=$(tofu output -raw ecs_cluster_name)
          SUBNETS=$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) --query "Subnets[0:2].SubnetId" --output text | tr '\t' ',' | sed 's/,/,/g')
          SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=insight-test-tkr0n-ecs-sg --query "SecurityGroups[0].GroupId" --output text)
          echo "Running prisma migrate deploy on $CLUSTER"
          TASK_ARN=$(aws ecs run-task --cluster $CLUSTER --task-definition insight-test-tkr0n-backend --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" --overrides '{"containerOverrides":[{"name":"backend","command":["sh","-c","npx prisma migrate deploy"]}]}' --query "tasks[0].taskArn" --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster $CLUSTER --tasks $TASK_ARN || true
          LOG_STREAM=$(aws ecs describe-tasks --cluster $CLUSTER --tasks $TASK_ARN --query "tasks[0].containers[0].logStreamName" --output text 2>/dev/null || echo "")
          if [ "$LOG_STREAM" != "None" ] && [ -n "$LOG_STREAM" ]; then aws logs get-log-events --log-group-name "/ecs/insight-test-tkr0n-backend" --log-stream-name "$LOG_STREAM" --query "events[].message" --output text || true; fi
        working-directory: infra

      - name: Wait for services to stabilize
        run: |
          CLUSTER=$(tofu output -raw ecs_cluster_name)
          FRONTEND_SERVICE=$(tofu output -raw frontend_service_name)
          BACKEND_SERVICE=$(tofu output -raw backend_service_name)
          
          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable --cluster $CLUSTER --services $FRONTEND_SERVICE $BACKEND_SERVICE
          echo "Services are stable"
        working-directory: infra

      - name: Get frontend URL
        id: frontend-url
        run: |
          URL=$(tofu output -raw frontend_url)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Frontend URL" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
        working-directory: infra
