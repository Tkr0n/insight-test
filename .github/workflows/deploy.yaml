name: Distributed Multi-Arch Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/backend
      - name: Run tests
        run: npm test
        working-directory: apps/backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend
      - name: Run tests
        run: npm test
        working-directory: apps/frontend

  build-backend-arm:
    needs: [test-backend]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-backend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-arm64

  build-backend-amd64:
    needs: [test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-backend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-amd64

  merge-backend:
    needs: [build-backend-arm, build-backend-amd64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-backend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.IMAGE_NAME }}:latest-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:latest

  build-frontend-arm:
    needs: [test-frontend]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-frontend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-arm64

  build-frontend-amd64:
    needs: [test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-frontend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest-amd64

  merge-frontend:
    needs: [build-frontend-arm, build-frontend-amd64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/insightt-frontend" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.IMAGE_NAME }}:latest-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:latest

  deploy-infrastructure:
    needs: [merge-backend, merge-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: Terraform Init
        run: tofu init
        working-directory: infra

      - name: Terraform Plan
        run: tofu plan -input=false -out=tfplan
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform Apply
        run: tofu apply -input=false -auto-approve tfplan
        working-directory: infra

      - name: Deploy frontend to ECS
        run: |
          CLUSTER=$(tofu output -raw ecs_cluster_name)
          SERVICE=$(tofu output -raw frontend_service_name)
          
          # Get current task definition
          TASK_DEF=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE --query "services[0].taskDefinition" --output text)
          
          # Register new task definition with latest image
          aws ecs register-task-definition \
            --family insight-test-tkr0n-frontend \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 256 \
            --memory 512 \
            --execution-role-arn $(aws ecs describe-task-definition --task-definition $TASK_DEF --query "taskDefinition.executionRoleArn" --output text) \
            --container-definitions "[{\"name\":\"frontend\",\"image\":\"ghcr.io/tkr0n/insight-test/insightt-frontend:latest\",\"essential\":true,\"portMappings\":[{\"containerPort\":80,\"hostPort\":80,\"protocol\":\"tcp\"}],\"logConfiguration\":{\"logDriver\":\"awslogs\",\"options\":{\"awslogs-group\":\"/ecs/insight-test-tkr0n-frontend\",\"awslogs-region\":\"us-east-2\",\"awslogs-stream-prefix\":\"ecs\"}}}]" \
            > /dev/null
          
          # Update service with new task definition
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --task-definition insight-test-tkr0n-frontend \
            --force-new-deployment \
            > /dev/null
          
          echo "Frontend deployed to ECS"
        working-directory: infra

      - name: Deploy backend to ECS
        run: |
          CLUSTER=$(tofu output -raw ecs_cluster_name)
          SERVICE=$(tofu output -raw backend_service_name)
          
          # Get current task definition
          TASK_DEF=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE --query "services[0].taskDefinition" --output text)
          
          # Get environment variables from Terraform
          DB_ENDPOINT=$(tofu output -raw rds_endpoint)
          DB_PORT=$(tofu output -raw rds_port)
          REDIS_ENDPOINT=$(tofu output -raw redis_endpoint)
          REDIS_PORT=$(tofu output -raw redis_port)
          COGNITO_POOL_ID=$(tofu output -raw cognito_user_pool_id)
          COGNITO_CLIENT_ID=$(tofu output -raw cognito_client_id)
          
          # Register new task definition with latest image
          aws ecs register-task-definition \
            --family insight-test-tkr0n-backend \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 256 \
            --memory 512 \
            --execution-role-arn $(aws ecs describe-task-definition --task-definition $TASK_DEF --query "taskDefinition.executionRoleArn" --output text) \
            --container-definitions "[{\"name\":\"backend\",\"image\":\"ghcr.io/tkr0n/insight-test/insightt-backend:latest\",\"essential\":true,\"portMappings\":[{\"containerPort\":3000,\"hostPort\":3000,\"protocol\":\"tcp\"}],\"environment\":[{\"name\":\"DATABASE_URL\",\"value\":\"postgresql://insight_test_user:${{ secrets.DB_PASSWORD }}@$DB_ENDPOINT:$DB_PORT/insight_test_db\"},{\"name\":\"REDIS_URL\",\"value\":\"redis://$REDIS_ENDPOINT:$REDIS_PORT\"},{\"name\":\"AWS_REGION\",\"value\":\"us-east-2\"},{\"name\":\"COGNITO_USER_POOL_ID\",\"value\":\"$COGNITO_POOL_ID\"},{\"name\":\"COGNITO_CLIENT_ID\",\"value\":\"$COGNITO_CLIENT_ID\"},{\"name\":\"NODE_ENV\",\"value\":\"production\"},{\"name\":\"PORT\",\"value\":\"3000\"},{\"name\":\"CORS_ORIGIN\",\"value\":\"*\"}],\"logConfiguration\":{\"logDriver\":\"awslogs\",\"options\":{\"awslogs-group\":\"/ecs/insight-test-tkr0n-backend\",\"awslogs-region\":\"us-east-2\",\"awslogs-stream-prefix\":\"ecs\"}}}]" \
            > /dev/null
          
          # Update service with new task definition
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --task-definition insight-test-tkr0n-backend \
            --force-new-deployment \
            > /dev/null
          
          echo "Backend deployed to ECS"
        working-directory: infra

      - name: Wait for services to stabilize
        run: |
          CLUSTER=$(tofu output -raw ecs_cluster_name)
          FRONTEND_SERVICE=$(tofu output -raw frontend_service_name)
          BACKEND_SERVICE=$(tofu output -raw backend_service_name)
          
          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable --cluster $CLUSTER --services $FRONTEND_SERVICE $BACKEND_SERVICE
          echo "Services are stable"
        working-directory: infra

      - name: Get frontend URL
        id: frontend-url
        run: |
          URL=$(tofu output -raw frontend_url)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Frontend URL" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
        working-directory: infra
