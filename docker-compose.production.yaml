version: "3.9"

services:
  frontend:
    image: ghcr.io/tkr0n/insight-test/insightt-frontend:latest
    container_name: insightt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - coolify

  backend:
    image: ghcr.io/tkr0n/insight-test/insightt-backend:latest
    container_name: insightt_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${RDS_ENDPOINT}:5432/${DB_NAME}
      REDIS_URL: redis://${REDIS_ENDPOINT}:${REDIS_PORT}
      AWS_REGION: us-east-1
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    networks:
      - coolify

networks:
  coolify:
    external: true
