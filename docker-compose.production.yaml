version: "3.9"

services:
  frontend:
    image: ghcr.io/tkr0n/insight-test/insightt-frontend:latest
    container_name: insightt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - insightt_network
      - coolify

  backend:
    image: ghcr.io/tkr0n/insight-test/insightt-backend:latest
    container_name: insightt_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://insightt_user:insightt_password@pgbouncer:6432/insightt_db
      REDIS_URL: redis://redis:6379
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      LOCALSTACK_ENDPOINT: http://localstack:4566
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - insightt_network

  postgres:
    image: postgres:16-alpine
    container_name: insightt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: insightt_user
      POSTGRES_PASSWORD: insightt_password
      POSTGRES_DB: insightt_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - insightt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightt_user -d insightt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: insightt_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: insightt_user
      DB_PASSWORD: insightt_password
      DB_NAME: insightt_db
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_TLS_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insightt_network

  redis:
    image: redis:7-alpine
    container_name: insightt_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - insightt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.5
    container_name: insightt_localstack
    restart: unless-stopped
    environment:
      SERVICES: cognito,lambda
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    networks:
      - insightt_network

volumes:
  postgres_data:
  redis_data:
  localstack_data:

networks:
  insightt_network:
    driver: bridge
  coolify:
    external: true
