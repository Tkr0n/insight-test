version: "3.9"

services:
  frontend:
    image: ghcr.io/${REPO_OWNER:-tkr0n}/insight-test-frontend:latest
    container_name: insightt_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:-us-east-1_local}
      VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-localclientid}
      VITE_AWS_ENDPOINT: ${VITE_AWS_ENDPOINT:-http://localhost:4566}
    depends_on:
      - backend
    networks:
      - insightt_network

  backend:
    image: ghcr.io/${REPO_OWNER:-tkr0n}/insight-test-backend:latest
    container_name: insightt_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://insightt_user:insightt_password@pgbouncer:6432/insightt_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://localstack:4566}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - insightt_network

  postgres:
    image: postgres:16-alpine
    container_name: insightt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightt_password}
      POSTGRES_DB: ${POSTGRES_DB:-insightt_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - insightt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightt_user} -d ${POSTGRES_DB:-insightt_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: insightt_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-insightt_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-insightt_password}
      DB_NAME: ${POSTGRES_DB:-insightt_db}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_TLS_SSLMODE: disable
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insightt_network

  redis:
    image: redis:7-alpine
    container_name: insightt_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - insightt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.5
    container_name: insightt_localstack
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: cognito,lambda
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    networks:
      - insightt_network

volumes:
  postgres_data:
  redis_data:
  localstack_data:

networks:
  insightt_network:
    driver: bridge