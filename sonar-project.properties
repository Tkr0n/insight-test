# ============================================
# SonarQube Configuration - Insightt Monorepo
# ============================================

sonar.projectKey=insightt
sonar.projectName=Insightt Task Manager
sonar.projectVersion=0.1.0

# ---- Sources ----
sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/src/__tests__,apps/backend/src/**/__tests__,apps/frontend/cypress,apps/frontend/src/tests

# ---- Exclusions ----
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/build/**,\
  **/cypress/**,\
  **/__tests__/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/*.config.*,\
  **/coverage/**,\
  **/public/**,\
  **/*.d.ts

sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/cypress/**,\
  **/__tests__/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/*.config.*,\
  **/coverage/**,\
  **/public/**,\
  **/*.d.ts

# ---- TypeScript ----
sonar.typescript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info

# ---- Encoding ----
sonar.sourceEncoding=UTF-8
